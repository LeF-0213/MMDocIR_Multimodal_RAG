# PR마다 문서 갱신·일관성(tools/docs_check.py)과 Mermaid 그림(tools/diagram_check.py)을 검사한다.
# 규칙은 .github/docs-check.json에 있다.
# main 브랜치 Ruleset "main 보호"가 이 작업(docs-check)을 필수 상태 검사로 지정해 실패하면 머지가 막힌다.
# 단위 테스트는 여기서 돌리지 않는다.
name: docs-check

on:
  pull_request:
    # edited: PR 설명에 예외 이유를 적거나 고치면 다시 검사한다.
    # labeled/unlabeled: 예외 라벨(docs-not-needed)을 붙이거나 떼면 다시 검사한다.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

# 저장소를 읽기만 한다. 댓글·라벨·상태 쓰기 권한을 주지 않는다.
permissions:
  contents: read

jobs:
  docs-check:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v7.0.1(2026-07-20 공개, Node 24 실행). v4는 지원이 끝난 Node 20을 써 경고가 떴다.
      # 태그는 옮겨질 수 있어 커밋 SHA로 고정한다(2026-11-12 git ls-remote로 확인).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # base...head 분기점을 계산하려면 두 브랜치의 이력이 모두 필요하다.
          fetch-depth: 0
      # 러너에 기본으로 있는 python3(표준 라이브러리만 사용)로 실행한다. PR 설명은 명령줄에 넣지 않고
      # 이벤트 파일에서 읽어, 설명에 쓴 글자가 셸 명령으로 해석되지 않게 한다.
      - name: 문서 갱신·일관성 검사
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -I tools/docs_check.py --config .github/docs-check.json --base "$BASE_SHA" --head "$HEAD_SHA" --event "$GITHUB_EVENT_PATH"
      # 그림 검사 도구: tools/diagram/package-lock.json에 고정한 mermaid-cli·mermaid·puppeteer를 설치한다.
      # puppeteer가 설치 중에 헤드리스 브라우저를 내려받는다. 러너 기본 Node(18 이상)로 충분하다.
      - name: 그림 검사 도구 설치
        if: ${{ !cancelled() }}
        run: npm ci --prefix tools/diagram --no-audit --no-fund
      # 한글 글꼴이 없으면 글자 폭이 달라져 로컬과 다른 배치로 판정한다.
      - name: 한글 글꼴 설치
        if: ${{ !cancelled() }}
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-nanum
      # 앞 단계가 실패해도 그림 결과까지 한 번에 보이도록 실행한다. 어느 단계든 실패하면 작업은 실패한다.
      - name: Mermaid 그림 검사
        if: ${{ !cancelled() }}
        run: python3 -I tools/diagram_check.py --config .github/docs-check.json
